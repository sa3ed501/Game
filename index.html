<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>الفجر الأخير</title>
<style>
:root{--bar-bg:rgba(0,0,0,.45);--txt:#fff}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1a12;font-family:-apple-system,system-ui,sans-serif;color:var(--txt)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;pointer-events:none}
.bar{background:var(--bar-bg);border-radius:8px;height:20px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;transition:width .15s}
.bar span{position:absolute;inset:0;font-size:12px;line-height:20px;padding:0 8px;font-weight:600}
#inv{position:fixed;top:calc(env(safe-area-inset-top,0px) + 80px);right:12px;background:var(--bar-bg);border-radius:10px;padding:6px 10px;font-size:14px;line-height:1.6;pointer-events:none}
#msg{position:fixed;top:30%;left:0;right:0;text-align:center;font-size:16px;font-weight:700;text-shadow:0 1px 4px #000;pointer-events:none;opacity:0;transition:opacity .3s}
#joy{position:fixed;left:0;bottom:0;width:55%;height:50%}
#base,#knob{position:fixed;border-radius:50%;display:none;pointer-events:none}
#base{width:110px;height:110px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35)}
#knob{width:50px;height:50px;background:rgba(255,255,255,.45)}
#btns{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:grid;grid-template-columns:repeat(2,68px);gap:12px}
.b{width:68px;height:68px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(0,0,0,.4);font-size:28px;color:#fff;display:flex;align-items:center;justify-content:center}
.b.on{background:rgba(255,255,255,.35)}
#over{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
#over button{font-size:18px;padding:12px 28px;border-radius:12px;border:0;background:#e8b04a;color:#222;font-weight:700}
#craft{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,360px);max-height:80vh;overflow:auto;background:rgba(10,20,15,.94);border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:12px;display:none;z-index:5}
#craft h3{margin:0 0 8px;text-align:center}
.rc{display:flex;flex-direction:column;width:100%;margin:6px 0;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font-size:15px;text-align:right;gap:2px;font-family:inherit}
.rc.ok{border-color:#e8b04a;background:rgba(232,176,74,.18)}
.rc small{opacity:.7}.rc em{font-style:normal;font-size:13px}
#menu{position:fixed;inset:0;z-index:10;background:rgba(8,16,12,.97);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;overflow:auto;text-align:center}
#menu h1{margin:0 0 4px;font-size:30px}#menu .sub{opacity:.7;font-size:13px;margin-bottom:10px}
.mb{width:min(86vw,340px);padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:17px;font-family:inherit}
.mb.pri{background:#e8b04a;color:#222;font-weight:700;border-color:#e8b04a}
.mb.sm{padding:8px;font-size:14px;width:auto;flex:1}
.card{width:min(86vw,340px);background:rgba(255,255,255,.07);border-radius:12px;padding:10px}
.row{display:flex;gap:6px;margin-top:8px}
.stat{width:min(86vw,340px);display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.12)}
#bPause{position:fixed;top:calc(env(safe-area-inset-top,0px) + 80px);left:12px;width:44px;height:44px;font-size:20px}
#hotbar{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 134px);display:flex;flex-direction:column;flex-wrap:wrap;direction:ltr;align-content:flex-start;max-height:270px;gap:5px}
.slot{width:48px;height:48px;border-radius:10px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.25);font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:transform .12s}
.slot small{font-size:9px;opacity:.75;margin-top:2px}
.slot.on{border-color:#e8b04a;background:rgba(232,176,74,.3);transform:scale(1.1);box-shadow:0 0 10px rgba(232,176,74,.6)}
#bBuild{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 176px);width:48px;height:48px;font-size:22px}
#bBuild.on{background:rgba(232,176,74,.45);border-color:#e8b04a}
#bmInfo{position:fixed;top:calc(env(safe-area-inset-top,0px) + 108px);left:50%;transform:translateX(-50%);background:rgba(232,176,74,.92);color:#222;font-size:13px;font-weight:700;padding:4px 12px;border-radius:14px;display:none;pointer-events:none;white-space:nowrap}
#inv2{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 232px);background:var(--bar-bg);border-radius:10px;padding:6px 10px;font-size:14px;line-height:1.5;pointer-events:none;display:none}
#rot{position:fixed;inset:0;z-index:50;background:#0b1a12;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;font-size:20px;font-weight:700}
#rot small{font-size:13px;font-weight:400;opacity:.7;max-width:300px;line-height:1.6}
@media (orientation:portrait){#rot{display:flex}}
@media (orientation:landscape){
 #hud{top:calc(env(safe-area-inset-top,0px) + 2px);left:calc(env(safe-area-inset-left,0px) + 6px);right:auto;width:min(44vw,330px);padding:6px;gap:4px 8px}
 .bar{height:18px}.bar span{font-size:11px;line-height:18px}
 #inv{top:calc(env(safe-area-inset-top,0px) + 6px);right:calc(env(safe-area-inset-right,0px) + 8px);font-size:13px;line-height:1.5;padding:4px 8px}
 #inv2{top:calc(env(safe-area-inset-top,0px) + 80px);right:calc(env(safe-area-inset-right,0px) + 8px);font-size:13px;padding:3px 8px}
 #bPause{top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);width:40px;height:40px;font-size:18px}
 #bBuild{top:calc(env(safe-area-inset-top,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 150px);width:42px;height:42px;font-size:20px}
 #bmInfo{top:calc(env(safe-area-inset-top,0px) + 54px);font-size:12px}
 #hotbar{top:calc(env(safe-area-inset-top,0px) + 66px);left:calc(env(safe-area-inset-left,0px) + 8px);max-height:calc(100vh - 80px - env(safe-area-inset-bottom,0px));gap:4px}
 .slot{width:42px;height:42px;font-size:20px}.slot small{font-size:8px}
 #btns{right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);grid-template-columns:repeat(2,58px);gap:8px}
 #btns .b{width:58px;height:58px;font-size:24px}
 #btns #bRun{height:50px;font-size:18px}
 #joy{width:42%;height:72%}
 #msg{top:22%}
 #craft{max-height:88vh}
 #menu{justify-content:flex-start;padding:12px;gap:8px}
 #menu>:first-child{margin-top:auto}#menu>:last-child{margin-bottom:auto}
 #menu h1{font-size:22px}.mb{padding:9px;font-size:15px}.card{padding:6px}.stat{padding:5px 4px}
}
#joy{z-index:1}
#base,#knob{z-index:2}
#hud,#inv,#inv2,#bPause,#hotbar,#bBuild,#bmInfo,#btns{z-index:3}
#over{z-index:8}
#craft,#craft *,#menu,#menu *{touch-action:pan-y}
#craft{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@media (orientation:landscape){
 #craft{width:min(92vw,640px)}
 .rc{display:inline-flex;width:calc(50% - 4px);margin:3px 2px;vertical-align:top}
 #cClose{display:flex;width:calc(100% - 4px)}
}
#obj{position:fixed;top:calc(env(safe-area-inset-top,0px) + 52px);left:50%;transform:translateX(-50%);background:var(--bar-bg);padding:4px 12px;border-radius:12px;font-size:12px;font-weight:600;pointer-events:none;z-index:3;display:none;max-width:56vw;text-align:center}
#objA{color:#e8b04a;font-size:15px;display:inline-block}
#boss{position:fixed;top:calc(env(safe-area-inset-top,0px) + 80px);left:50%;transform:translateX(-50%);width:min(60vw,320px);text-align:center;display:none;z-index:3;font-size:12px;pointer-events:none}
.bb{height:10px;background:rgba(0,0,0,.5);border-radius:6px;overflow:hidden;margin-top:2px}.bb i{display:block;height:100%;background:#7b3fe0}
#hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;transform:translateX(-50%);background:rgba(232,176,74,.92);color:#222;font-weight:700;font-size:13px;padding:5px 14px;border-radius:14px;pointer-events:none;display:none;z-index:3}
#story{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);width:min(92vw,680px);background:rgba(10,14,12,.96);border:2px solid #e8b04a;border-radius:14px;padding:10px 16px;z-index:9;display:none;cursor:pointer}
#stT{color:#e8b04a;font-size:12px;font-weight:700}#stS{color:#8fd3ff;font-weight:700;font-size:14px;margin-top:2px}
#stX{font-size:16px;line-height:1.7;min-height:52px;margin-top:2px}
#stB{display:flex;gap:8px;margin-top:6px;justify-content:flex-end;flex-wrap:wrap}#stB .mb{width:auto;padding:8px 20px}
#bJournal{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 200px);width:42px;height:42px;font-size:20px;z-index:3}
@media (orientation:landscape){#bmInfo{top:calc(env(safe-area-inset-top,0px) + 86px)}}
#bMap{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 250px);width:42px;height:42px;font-size:20px;z-index:3}
#vig{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.4) 100%)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="bar"><i id="hp" style="background:#d9453d"></i><span>❤️ الصحة</span></div>
  <div class="bar"><i id="st" style="background:#e0c23a"></i><span>⚡ الطاقة</span></div>
  <div class="bar"><i id="hu" style="background:#c9742e"></i><span>🍖 الجوع</span></div>
  <div class="bar"><i id="th" style="background:#3a8fd9"></i><span>💧 العطش</span></div>
</div>
<div id="inv"></div>
<div id="inv2"></div>
<div id="msg"></div>
<div id="craft"></div>
<div class="b" id="bPause">⏸</div>
<div id="hotbar"></div>
<div class="b" id="bBuild">🏠</div>
<div id="bmInfo"></div>
<div id="obj"><span id="objA">➤</span> <span id="objT"></span></div>
<div id="boss"><b>🐺 الحارس المتحوّل</b><div class="bb"><i id="bossI"></i></div></div>
<div id="hint"></div>
<div class="b" id="bJournal">📜</div>
<div class="b" id="bMap">🗺</div>
<div id="story"><div id="stT"></div><div id="stS"></div><div id="stX"></div><div id="stB"></div></div>
<div id="vig"></div>
<div id="menu"></div>
<div id="rot"><div style="font-size:64px">📱↻</div><div>أدر هاتفك إلى الوضع الأفقي</div><small>إذا لم يدور الهاتف، أطفئ «قفل الدوران العمودي» من مركز التحكم في الآيفون</small></div>
<div id="joy"></div><div id="base"></div><div id="knob"></div>
<div id="btns">
  <div class="b" id="bAtk">⚔️</div>
  <div class="b" id="bAct">✋</div>
  <div class="b" id="bFire">🛠</div>
  <div class="b" id="bEat">🍖</div>
  <div class="b" id="bRun" style="grid-column:span 2;width:100%;border-radius:34px">⚡ جري</div>
</div>
<div id="over"><div style="font-size:48px">💀</div><div id="overT" style="font-size:20px"></div><button id="again">عُد من آخر حفظ</button></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const off=document.createElement('canvas'),octx=off.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,(window.__q||2));W=innerWidth;H=innerHeight;cv.width=off.width=W*DPR;cv.height=off.height=H*DPR;}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));resize();

const WORLD=4800;
const rnd=(a,b)=>a+Math.random()*(b-a);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let G;

function init(){
  G={t:0,p:{x:WORLD/2,y:WORLD/2,hp:100,st:100,hu:100,th:100,face:1,atkCd:0,actCd:0,hurt:0},
     inv:{wood:0,stone:0,food:0,iron:0,copper:0,bone:0,ingotI:0,ingotC:0,seed:2,wheat:0},trees:[],bushes:[],rocks:[],ponds:[],fires:[],wolves:[],mutants:[],animals:[],exp:new Array(3600).fill(0),ride:null,dead:false,kills:0,tools:{},eq:null,builds:[],stations:[],corpses:[],ores:[],q:{ch:0,i:-1,docs:{},f:{},k0:0,end:null},swing:0,swD:0.36};
  scatter(G.trees,340,5,{plains:.4,forest:1,snow:.55,desert:.1,swamp:.7,volcano:.12});
  scatter(G.bushes,120,3,{plains:.9,forest:.7,snow:.1,desert:.03,swamp:.4,volcano:.02});
  scatter(G.rocks,110,4,{plains:.3,forest:.35,snow:.6,desert:.7,swamp:.2,volcano:1});
  scatter(G.ponds,16,0,{plains:.5,forest:.5,snow:.15,desert:.08,swamp:1,volcano:0},o=>{o.r=rnd(60,110);});
  // clear spawn area
  const c={x:WORLD/2,y:WORLD/2};
  for(const k of['trees','bushes','rocks'])G[k]=G[k].filter(o=>dist(o,c)>120);
  G.ponds.push({x:WORLD/2+170,y:WORLD/2+40,r:70});genOres();nearSpawn();genAnimals();
  $('over').style.display='none';
  if(wantLoad&&loadGame())say('تم استعادة التقدم 💾');else say('اجمع الخشب والطعام قبل حلول الليل!');BM=false;lastCell=-1;WX.state='clear';WX.t=75;WX.k=0;WX.tk=0;WX.flash=0;renderHotbar();
}

// ---------- input ----------
const inp={x:0,y:0,run:false,act:false,atk:false};
let joyId=null,ox=0,oy=0;
const joy=$('joy'),base=$('base'),knob=$('knob');
joy.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];joyId=t.identifier;ox=t.clientX;oy=t.clientY;
  base.style.display=knob.style.display='block';
  base.style.left=ox-55+'px';base.style.top=oy-55+'px';knob.style.left=ox-25+'px';knob.style.top=oy-25+'px';},{passive:false});
joy.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){if(t.identifier!==joyId)continue;
  let dx=t.clientX-ox,dy=t.clientY-oy;const d=Math.hypot(dx,dy),m=55;
  if(d>m){dx=dx/d*m;dy=dy/d*m;}
  inp.x=dx/m;inp.y=dy/m;knob.style.left=ox+dx-25+'px';knob.style.top=oy+dy-25+'px';}},{passive:false});
const endJoy=e=>{for(const t of e.changedTouches)if(t.identifier===joyId){joyId=null;inp.x=inp.y=0;base.style.display=knob.style.display='none';}};
joy.addEventListener('touchend',endJoy);joy.addEventListener('touchcancel',endJoy);

function hold(id,key){const el=$(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();inp[key]=true;el.classList.add('on');},{passive:false});
  const up=e=>{e.preventDefault();inp[key]=false;el.classList.remove('on');};
  el.addEventListener('touchend',up);el.addEventListener('touchcancel',up);}
hold('bRun','run');hold('bAct','act');hold('bAtk','atk');
function tap(id,fn){const el=$(id);el.addEventListener('touchstart',e=>{e.preventDefault();fn();},{passive:false});el.addEventListener('click',fn);}
tap('bEat',eat);tap('bFire',toggleCraft);
$('again').addEventListener('click',()=>{wantLoad=true;init();wantLoad=false;inGame=true;saveGame(true);});

// keyboard (for testing on desktop)
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='e')inp.act=true;if(e.key===' ')inp.atk=true;if(e.key==='f')eat();if(e.key==='c')craftFire();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key==='e')inp.act=false;if(e.key===' ')inp.atk=false;});

// ---------- save ----------
let SAVE_KEY='lastdawn_slot1';
function saveLocal(){if(!G||G.dead)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify({t:G.t,p:G.p,inv:G.inv,trees:G.trees,bushes:G.bushes,rocks:G.rocks,ponds:G.ponds,fires:G.fires,tools:G.tools,eq:G.eq,builds:G.builds,stations:G.stations,corpses:G.corpses,ores:G.ores,q:G.q,ws:WORLD,animals:G.animals,exp:G.exp,kills:G.kills}));}catch(e){}}
function loadGame(){try{const s=localStorage.getItem(SAVE_KEY);if(!s)return false;const d=JSON.parse(s);{const old=!d.ws,keep=old?{trees:G.trees,bushes:G.bushes,rocks:G.rocks,ponds:G.ponds,ores:G.ores}:null;Object.assign(G,d);if(old){Object.assign(G,keep);const sh=1200;G.p.x+=sh;G.p.y+=sh;for(const f of d.fires||[]){f.x+=sh;f.y+=sh;}for(const st of d.stations||[]){st.x+=sh;st.y+=sh;}for(const b of d.builds||[]){b.gx+=15;b.gy+=15;}}}if(!G.tools)G.tools={};if(!G.builds)G.builds=[];if(!G.stations)G.stations=[];if(!G.corpses)G.corpses=[];if(!G.ores)genOres();G.inv=Object.assign({wood:0,stone:0,food:0,iron:0,copper:0,bone:0,ingotI:0,ingotC:0,seed:0,wheat:0},G.inv);G.dead=false;G.wolves=[];G.mutants=[];G.ride=null;if(G.p.hp<40)G.p.hp=40;if(G.p.hu<30)G.p.hu=30;if(G.p.th<30)G.p.th=30;return true;}catch(e){return false;}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
setInterval(saveGame,5000);
addEventListener('visibilitychange',()=>{if(document.hidden)saveGame();});
addEventListener('pagehide',saveGame);
// ---------- crafting ----------
let craftOpen=false;
const RECIPES=[
 {id:'fire',n:'🔥 نار مخيم',c:{wood:5,stone:2},d:'تدفئك وتُبعد الذئاب'},
 {id:'axe',n:'🪓 فأس',c:{wood:4,stone:3},d:'خشب ×2 لكل ضربة عند حمله'},
 {id:'pick',n:'⛏️ معول',c:{wood:3,stone:5},d:'حجر ×2 لكل ضربة عند حمله'},
 {id:'spear',n:'🔱 رمح',c:{wood:4,stone:2},d:'ضرر ×2 ومدى أطول عند حمله'},
 {id:'hammer',n:'🔨 مطرقة',c:{wood:5,stone:4},d:'سلاح ثقيل + يفتح وضع البناء 🏠'},
 {id:'torch',n:'🔦 مشعل',c:{wood:3,stone:0},d:'ضوء أوسع في الليل عند حمله'},
 {id:'furnace',n:'🏭 فرن',c:{stone:10,wood:4},d:'يصهر الخام إلى سبائك (يُوضع أمامك)'},
 {id:'bench',n:'🛠️ ورشة صناعة',c:{wood:10,stone:4},d:'لصناعة الأسلحة المتقدمة (يُوضع أمامك)'}];
const ICON={wood:'🪵',stone:'🪨',iron:'🔩',copper:'🟠',bone:'🦴',ingotI:'⛓️',ingotC:'🟧',seed:'🌱',wheat:'🌾'};
function renderCraft(){
 $('craft').innerHTML='<h3>🛠 التصنيع</h3>'+RECIPES.map(r=>{
  const own=r.id!=='fire'&&G.tools[r.id];
  const ok=Object.keys(r.c).every(k=>G.inv[k]>=r.c[k]);
  const cost=Object.keys(r.c).filter(k=>r.c[k]).map(k=>ICON[k]+r.c[k]).join(' ');
  return `<button class="rc ${ok&&!own?'ok':''}" data-id="${r.id}"><b>${r.n}</b><small>${r.d}</small><em>${own?'✅ تملكه':cost}</em></button>`;
 }).join('')+'<button class="rc" id="cClose" style="text-align:center">إغلاق</button>';
}
function toggleCraft(){if(G.dead)return;craftOpen=!craftOpen;$('craft').style.display=craftOpen?'block':'none';curSt=null;if(craftOpen)renderCraft();}

function weatherTick(dt){
 WX.t-=dt;
 if(WX.t<=0){
  const r=Math.random();
  if(WX.state==='clear'){WX.state=r<0.7?'rain':'storm';WX.t=rnd(50,90);}
  else if(WX.state==='rain'){WX.state=r<0.6?'clear':'storm';WX.t=WX.state==='clear'?rnd(70,140):rnd(30,60);}
  else{WX.state='rain';WX.t=rnd(30,50);}
  WX.tk=WX.state==='clear'?0:WX.state==='rain'?0.6:1;
  say(WX.state==='storm'?'⛈ عاصفة قادمة!':WX.state==='rain'?'🌧 بدأ المطر':'☀️ توقف المطر');
 }
 WX.k+=(WX.tk-WX.k)*Math.min(1,dt*0.5);
 WX.flash=Math.max(0,WX.flash-dt*2.5);
 if(WX.state==='storm'){WX.nl-=dt;if(WX.nl<=0){WX.nl=rnd(5,13);WX.flash=1;WX.thunder=WX.tdist=rnd(0.3,2.2);}}

}

const CS=80;

const PIECES=[['wall','🧱','جدار'],['door','🚪','باب'],['floor','🟫','أرضية'],['roof','🛖','سقف'],['plot','🌾','حقل']];
const bKey=b=>b.t==='floor'?'f'+b.gx+':'+b.gy:b.t==='roof'?'r'+b.gx+':'+b.gy:b.t==='plot'?'p'+b.gx+':'+b.gy:'e'+b.o+b.gx+':'+b.gy;
const afford=t=>Object.keys(BCOST[t]).every(k=>G.inv[k]>=BCOST[t][k]);
const costTxt=t=>Object.keys(BCOST[t]).map(k=>ICON[k]+BCOST[t][k]).join(' ');
function bCenter(b){const x=b.gx*CS,y=b.gy*CS;return b.t==='floor'||b.t==='roof'||b.t==='plot'?{x:x+CS/2,y:y+CS/2}:b.o==='h'?{x:x+CS/2,y}:{x,y:y+CS/2};}
function buildTarget(){
 const p=G.p,tx=p.x+(p.fx||0)*70,ty=p.y+(p.fy===undefined?1:p.fy)*70,gx=Math.floor(tx/CS),gy=Math.floor(ty/CS);
 if(BSEL==='floor'||BSEL==='roof'||BSEL==='plot')return{t:BSEL,gx,gy};
 const u=tx-gx*CS,v=ty-gy*CS,m=Math.min(u,v,CS-u,CS-v);
 if(m===v)return{t:BSEL,o:'h',gx,gy};
 if(m===CS-v)return{t:BSEL,o:'h',gx,gy:gy+1};
 if(m===u)return{t:BSEL,o:'v',gx,gy};
 return{t:BSEL,o:'v',gx:gx+1,gy};
}

 else{if(b.gx<0||b.gx>N||b.gy<0||b.gy>=N)return false;}

}

function collide(e,r,wolf){

  if(b.t!=='wall'&&b.t!=='door')continue;
  const x=b.gx*CS,y=b.gy*CS,h=b.o==='h';
  const parts=(b.t==='door'&&!wolf)?[[0,14],[CS-14,CS]]:[[0,CS]];
  for(const [s0,s1] of parts){
   const rx0=(h?x+s0:x)-th,rx1=(h?x+s1:x)+th,ry0=(h?y:y+s0)-th,ry1=(h?y:y+s1)+th;
   const cx=Math.max(rx0,Math.min(e.x,rx1)),cy=Math.max(ry0,Math.min(e.y,ry1));
   const dx=e.x-cx,dy=e.y-cy,d=Math.hypot(dx,dy);
   if(d<r){
    if(d>0.001){e.x+=dx/d*(r-d);e.y+=dy/d*(r-d);}
    else{const l=e.x-rx0,rr=rx1-e.x,t=e.y-ry0,bt=ry1-e.y,m=Math.min(l,rr,t,bt);
     if(m===l)e.x=rx0-r;else if(m===rr)e.x=rx1+r;else if(m===t)e.y=ry0-r;else e.y=ry1+r;}
   }
  }
 }
}

function emoji(ch,x,y,size){ctx.font=size+'px serif';ctx.fillText(ch,x,y);}
function render2D(){
  const dark=darkness();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const g=Math.round(70-dark*50);
  ctx.fillStyle=`rgb(${Math.round(60-dark*45)},${g+50},${Math.round(50-dark*35)})`;
  ctx.fillRect(0,0,W,H);
  const cx=W/2-G.p.x,cy=H/2-G.p.y;
  ctx.save();ctx.translate(cx,cy);
  ctx.textAlign='center';ctx.textBaseline='middle';
  // world border
  ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=6;ctx.strokeRect(0,0,WORLD,WORLD);
  const vx0=G.p.x-W/2-60,vx1=G.p.x+W/2+60,vy0=G.p.y-H/2-60,vy1=G.p.y+H/2+60;
  const vis=o=>o.x>vx0&&o.x<vx1&&o.y>vy0&&o.y<vy1;
  for(const o of G.ponds)if(o.x+o.r>vx0&&o.x-o.r<vx1&&o.y+o.r>vy0&&o.y-o.r<vy1){
    ctx.fillStyle='#2f78b8';ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,6.3);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=3;ctx.stroke();}
  for(const o of G.rocks)if(vis(o))emoji('🪨',o.x,o.y,30);
  for(const o of G.bushes)if(vis(o))emoji('🫐',o.x,o.y,28);
  for(const f of G.fires)emoji('🔥',f.x,f.y,34);
  const ents=[...G.trees.filter(vis).map(o=>({y:o.y,d:()=>emoji('🌲',o.x,o.y-14,54)})),
    ...G.wolves.map(w=>({y:w.y,d:()=>{ctx.globalAlpha=w.hit>0?.5:1;emoji('🐺',w.x,w.y,38);ctx.globalAlpha=1;}})),
    {y:G.p.y,d:()=>{ctx.save();ctx.translate(G.p.x,G.p.y);ctx.scale(-G.p.face,1);
      if(G.p.hurt>0)ctx.globalAlpha=.5;emoji('🧍',0,0,44);ctx.restore();}}];
  ents.sort((a,b)=>a.y-b.y);for(const e of ents)e.d();
  ctx.restore();
  // night overlay with light holes
  if(dark>0.05){
    octx.setTransform(DPR,0,0,DPR,0,0);octx.globalCompositeOperation='source-over';
    octx.clearRect(0,0,W,H);octx.fillStyle=`rgba(5,8,25,${dark*0.82})`;octx.fillRect(0,0,W,H);
    octx.globalCompositeOperation='destination-out';
    const hole=(x,y,r,a)=>{const gr=octx.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(0,0,0,${a})`);gr.addColorStop(1,'rgba(0,0,0,0)');octx.fillStyle=gr;octx.beginPath();octx.arc(x,y,r,0,6.3);octx.fill();};
    hole(W/2,H/2,G.eq==='torch'?200:110,.9);
    for(const f of G.fires)hole(f.x+cx,f.y+cy,170,1);
    ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(off,0,0);ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  if(G.p.hurt>0){ctx.fillStyle=`rgba(200,0,0,${G.p.hurt})`;ctx.fillRect(0,0,W,H);}
  // HUD

  const day=Math.floor(G.t/DAY)+1;
